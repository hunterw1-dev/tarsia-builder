<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will's Tarsia Builder</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6fa;color:#182033;font-family:Arial,sans-serif}
main{max-width:1180px;margin:auto;padding:18px}
h1{margin:0}.sub,.muted,#status{color:#667085}.sub{margin:5px 0 18px}
.bar,.card{background:white;border:1px solid #e2e7ef;border-radius:14px;padding:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
button,input{font:inherit}button{border:1px solid #cbd3df;background:white;border-radius:8px;padding:9px 12px;font-weight:bold;cursor:pointer}
.primary,.tabs .active{background:#182033;color:white}
.grid{display:grid;grid-template-columns:360px 1fr;gap:14px}
.head{display:flex;justify-content:space-between;align-items:center}.head h2{margin:0 0 10px}
.notice{background:#f8fafc;border-radius:8px;padding:9px;margin-bottom:10px;font-size:14px}
.row{display:grid;grid-template-columns:1fr 1fr 35px;gap:6px;margin:7px 0}
.row input{min-width:0;width:100%;padding:8px;border:1px solid #cbd3df;border-radius:7px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
svg{width:100%;height:auto;display:block;background:white;border:1px solid #e2e7ef;border-radius:8px}
.piece{fill:white;stroke:#182033;stroke-width:2}
.edgeText{font-size:11px;font-weight:bold;text-anchor:middle;dominant-baseline:middle}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
@media print{header,.bar,.editor,.tabs,#status,.notice{display:none!important}.grid{display:block}body,main,.card{margin:0;padding:0;border:0;background:white}svg{border:0}}
</style>
</head>
<body>
<main>
<header><h1>Will's Tarsia Builder</h1><p class="sub">Automatically sizes a triangular Tarsia to fit your matching pairs.</p></header>
<div class="bar"><button id="paste">Paste list</button><button id="add">+ Add pair</button><button id="demo">Load demo</button><button id="shuffle">Reshuffle cut sheet</button><button id="print" class="primary">Print / Save PDF</button></div>
<div class="grid">
<section class="card editor"><div class="head"><h2>Matching pairs</h2><span id="count" class="muted"></span></div><div class="notice">Each completed pair is placed on opposite sides of one shared edge.</div><div id="rows"></div></section>
<section class="card"><div class="head"><h2>Preview</h2><strong id="sizeLabel"></strong></div><div class="tabs"><button id="solved" class="active">Solved / answer key</button><button id="cut">Printable cut pieces</button></div><svg id="svg" viewBox="0 0 820 740"></svg><p id="status"></p></section>
</div>
</main>
<script>
const $=s=>document.querySelector(s),R=$("#rows"),S=$("#svg");
const DEMO=[["7 × 8","56"],["H₂O","Water"],["NaCl","Sodium chloride"],["3²","9"],["Mitochondria","Produces ATP"],["Cell","Basic unit of life"],["12 ÷ 3","4"],["5 + 6","11"],["CO₂","Carbon dioxide"]];
let P=JSON.parse(localStorage.getItem("wtb-pairs")||"null")||DEMO.map(x=>[...x]),mode="solved",seed=1;
const E=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const valid=()=>P.filter(p=>p[0].trim()&&p[1].trim());
function save(){localStorage.setItem("wtb-pairs",JSON.stringify(P))}
function rows(){R.innerHTML=P.map((p,i)=>`<div class="row"><input data-i="${i}" data-k="0" value="${E(p[0])}" placeholder="Term"><input data-i="${i}" data-k="1" value="${E(p[1])}" placeholder="Match"><button data-r="${i}">×</button></div>`).join("");$("#count").textContent=valid().length+" pairs";draw()}
R.oninput=e=>{if(e.target.dataset.i!=null){P[+e.target.dataset.i][+e.target.dataset.k]=e.target.value;save();$("#count").textContent=valid().length+" pairs";draw()}};
R.onclick=e=>{if(e.target.dataset.r!=null){P.splice(+e.target.dataset.r,1);if(!P.length)P.push(["",""]);save();rows()}};
$("#add").onclick=()=>{P.push(["",""]);save();rows()};
$("#demo").onclick=()=>{P=DEMO.map(x=>[...x]);save();rows()};
$("#paste").onclick=()=>{let t=prompt("Paste one pair per line using term | match. Tabs from Sheets/Excel also work.");if(!t)return;let a=t.split(/\r?\n/).filter(x=>x.trim()).map(x=>{let q=x.includes("\t")?x.split("\t"):x.split("|");return[(q.shift()||"").trim(),q.join("|").trim()]});if(a.length){P=a;save();rows()}};
$("#shuffle").onclick=()=>{seed++;mode="cut";tabs();draw()};$("#print").onclick=()=>window.print();
$("#solved").onclick=()=>{mode="solved";tabs();draw()};$("#cut").onclick=()=>{mode="cut";tabs();draw()};
function tabs(){$("#solved").classList.toggle("active",mode==="solved");$("#cut").classList.toggle("active",mode==="cut")}
function cap(n){return 3*n*(n-1)/2}function sizeFor(k){let n=2;while(cap(n)<k&&n<10)n++;return n}
function vertex(r,c,n){let side=Math.min(165,650/n),h=side*Math.sqrt(3)/2;return[410+(c-r/2)*side,45+r*h]}
function makePieces(n){let a=[];for(let r=0;r<n;r++)for(let c=0;c<=r;c++){a.push({v:[vertex(r,c,n),vertex(r+1,c,n),vertex(r+1,c+1,n)]});if(c<r)a.push({v:[vertex(r,c,n),vertex(r,c+1,n),vertex(r+1,c+1,n)]})}return a}
function edgeKey(a,b){let A=a.map(x=>x.toFixed(3)).join(","),B=b.map(x=>x.toFixed(3)).join(",");return A<B?A+"|"+B:B+"|"+A}
function links(ps){let m=new Map();ps.forEach((p,pi)=>p.v.forEach((a,e)=>{let k=edgeKey(a,p.v[(e+1)%3]);if(!m.has(k))m.set(k,[]);m.get(k).push({pi,e})}));return[...m.values()].filter(x=>x.length===2)}
function center(v){return[v.reduce((a,p)=>a+p[0],0)/3,v.reduce((a,p)=>a+p[1],0)/3]}
function edgeText(v,e,text,n){let a=v[e],b=v[(e+1)%3],c=center(v),mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy),nx=-dy/L,ny=dx/L;if((c[0]-mx)*nx+(c[1]-my)*ny<0){nx=-nx;ny=-ny}let off=Math.max(9,17-n),x=mx+nx*off,y=my+ny*off,ang=Math.atan2(dy,dx)*180/Math.PI;if(ang>90||ang<-90)ang+=180;let max=n>6?14:22,t=text.length>max?text.slice(0,max-1)+"…":text;return`<text class="edgeText" x="${x}" y="${y}" transform="rotate(${ang} ${x} ${y})">${E(t)}</text>`}
function model(){let G=valid(),n=sizeFor(G.length),ps=makePieces(n),sh=links(ps),labs=ps.map(()=>["","",""]);G.slice(0,sh.length).forEach((p,i)=>{let A=sh[i][0],B=sh[i][1];labs[A.pi][A.e]=p[0];labs[B.pi][B.e]=p[1]});return{G,n,ps,sh,labs}}
function solvedView(d){return d.ps.map((p,i)=>`<polygon class="piece" points="${p.v.map(q=>q.join(",")).join(" ")}"/>`+d.labs[i].map((t,e)=>t?edgeText(p.v,e,t,d.n):"").join("")).join("")}
function shuffled(n){let a=[...Array(n).keys()],x=seed*7919;for(let i=n-1;i;i--){x=(x*1664525+1013904223)>>>0;let j=x%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function transform(v,tx,ty,sc,deg){let c=center(v),a=deg*Math.PI/180,co=Math.cos(a),si=Math.sin(a);return v.map(p=>{let x=(p[0]-c[0])*sc,y=(p[1]-c[1])*sc;return[tx+x*co-y*si,ty+x*si+y*co]})}
function cutView(d){let N=d.ps.length,cols=N<=16?4:5,rows=Math.ceil(N/cols),cw=800/cols,ch=690/rows,base=Math.min(165,650/d.n),sc=Math.min(.7,cw*.7/base,ch*.7/(base*.866));return shuffled(N).map((idx,pos)=>{let col=pos%cols,row=Math.floor(pos/cols),x=cw/2+col*cw+10,y=ch/2+row*ch+20,v=transform(d.ps[idx].v,x,y,sc,[0,120,240][(pos+seed)%3]);return`<polygon class="piece" points="${v.map(q=>q.join(",")).join(" ")}"/>`+d.labs[idx].map((t,e)=>t?edgeText(v,e,t,d.n):"").join("")}).join("")}
function draw(){let d=model();S.innerHTML=mode==="solved"?solvedView(d):cutView(d);$("#sizeLabel").textContent=`Size ${d.n} • ${d.ps.length} pieces`;$("#status").textContent=`${d.G.length} pairs • ${d.sh.length} internal matching edges`+(d.sh.length>d.G.length?` • ${d.sh.length-d.G.length} unused edge(s)`:"")}
rows();
</script>
</body>
</html>
