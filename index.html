<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tarsia Builder</title><link rel="stylesheet" href="styles.css"></head><body><main><header><h1>Tarsia Builder</h1><p>Create, preview, shuffle, and print a classroom Tarsia puzzle.</p></header><section class="controls"><div><label>Shape</label><select id="shape"><option value="triangle">Triangle</option><option value="square">Square</option><option value="diamond">Diamond</option><option value="hexagon">Hexagon</option></select></div><div><label>Paper</label><select id="paper"><option value="letter">US Letter</option><option value="a4">A4</option></select></div><button id="pasteBtn">Paste list</button><button id="addBtn">+ Add pair</button><button id="shuffleBtn">Shuffle</button><button id="printBtn" class="primary">Print / Save PDF</button></section><p class="hint">Paste format: <code>term | match</code>, one pair per line. Tabs also work.</p><section class="workspace"><div class="editor"><div class="editor-head"><h2>Matching pairs</h2><span id="count"></span></div><div id="rows"></div></div><div class="preview"><div class="editor-head"><h2>Preview</h2><label class="toggle"><input id="solution" type="checkbox"> Answer key</label></div><svg id="svg" viewBox="0 0 800 700" aria-label="Tarsia puzzle preview"></svg><p id="status"></p></div></section></main><script src="geometry.js"></script><script src="renderer.js"></script><script src="app.js"></script></body></html>
