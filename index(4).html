<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Will's Tarsia Builder</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#182033;font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:1200px;margin:auto;padding:18px}h1{margin:0}.sub,.muted,#status{color:#667085}.sub{margin:4px 0 16px}.bar,.card{background:#fff;border:1px solid #e2e7ef;border-radius:14px;box-shadow:0 2px 10px #0001}.bar{display:flex;gap:8px;flex-wrap:wrap;padding:12px;margin-bottom:14px}button,input{font:inherit}button{border:1px solid #cbd3df;background:#fff;border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer}.primary,.tabs .active{background:#182033;color:#fff}.grid{display:grid;grid-template-columns:minmax(310px,.85fr) minmax(450px,1.3fr);gap:14px}.card{padding:14px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.head h2{font-size:1.08rem;margin:0 0 10px}.row{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin:7px 0}.row input{width:100%;min-width:0;border:1px solid #cbd3df;border-radius:8px;padding:9px}.row button{padding:7px 10px}.notice{background:#f8fafc;border-radius:9px;padding:10px;margin-bottom:10px;font-size:.9rem}.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{padding:7px 10px}svg{display:block;width:100%;height:auto;border:1px solid #e2e7ef;border-radius:10px;background:#fff}.piece{fill:#fff;stroke:#182033;stroke-width:2}.edgeText{font-weight:600;text-anchor:middle;dominant-baseline:middle}.pieceNo{font-size:9px;fill:#98a2b3;text-anchor:middle}.capacity{font-weight:700}
@media(max-width:800px){.grid{grid-template-columns:1fr}main{padding:10px}}@media print{header,.bar,.editor,.tabs,#status,.notice{display:none!important}body,main,.card{background:#fff;margin:0;padding:0;border:0;box-shadow:none}.grid{display:block}svg{border:0;width:100%}}
</style></head><body><main><header><h1>Will's Tarsia Builder</h1><p class="sub">The triangle automatically grows to fit the number of matching pairs.</p></header>
<div class="bar"><button id="paste">Paste list</button><button id="add">+ Add pair</button><button id="demo">Load demo</button><button id="shuffle">Reshuffle cut sheet</button><button id="print" class="primary">Print / Save PDF</button></div>
<div class="grid"><section class="card editor"><div class="head"><h2>Matching pairs</h2><span id="count" class="muted"></span></div><div class="notice">Enter or paste your pairs. The builder chooses the smallest triangular puzzle that has enough internal matching edges.</div><div id="rows"></div></section>
<section class="card"><div class="head"><h2>Preview</h2><span id="sizeLabel" class="capacity"></span></div><div class="tabs"><button id="solvedTab" class="active">Solved / answer key</button><button id="cutTab">Printable cut pieces</button></div><svg id="svg" viewBox="0 0 820 760"></svg><p id="status"></p></section></div></main>
<script>
const $=s=>document.querySelector(s),S=$("#svg"),R=$("#rows");
const DEMO=[["7 × 8","56"],["H₂O","Water"],["NaCl","Sodium chloride"],["3²","9"],["Mitochondria","Produces ATP"],["Cell","Basic unit of life"],["12 ÷ 3","4"],["5 + 6","11"],["CO₂","Carbon dioxide"]];
let P=JSON.parse(localStorage.getItem("willTarsiaPairs")||"null")||DEMO.map(x=>[...x]),mode="solved",seed=1;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),good=()=>P.filter(p=>p[0].trim()&&p[1].trim());
function save(){localStorage.setItem("willTarsiaPairs",JSON.stringify(P))}
function renderRows(){R.innerHTML=P.map((p,i)=>`<div class="row"><input data-i="${i}" data-k="0" value="${esc(p[0])}" placeholder="Term"><input data-i="${i}" data-k="1" value="${esc(p[1])}" placeholder="Match"><button data-r="${i}">×</button></div>`).join("");count();draw()}
function count(){$("#count").textContent=good().length+" complete pairs"}
R.oninput=e=>{if(e.target.dataset.i!=null){P[+e.target.dataset.i][+e.target.dataset.k]=e.target.value;save();count();draw()}};R.onclick=e=>{if(e.target.dataset.r!=null){P.splice(+e.target.dataset.r,1);if(!P.length)P.push(["",""]);save();renderRows()}};
$("#add").onclick=()=>{P.push(["",""]);save();renderRows()};$("#demo").onclick=()=>{P=DEMO.map(x=>[...x]);save();renderRows()};
$("#paste").onclick=()=>{let t=prompt("Paste one pair per line using: term | match\\nTwo columns copied from Sheets/Excel also work.");if(!t)return;let a=t.split(/\r?\n/).filter(x=>x.trim()).map(x=>{let q=x.includes("\t")?x.split("\t"):x.split("|");return[(q.shift()||"").trim(),q.join("|").trim()]});if(a.length){P=a;save();renderRows()}};
$("#shuffle").onclick=()=>{seed++;mode="cut";tabs();draw()};$("#print").onclick=()=>window.print();$("#solvedTab").onclick=()=>{mode="solved";tabs();draw()};$("#cutTab").onclick=()=>{mode="cut";tabs();draw()};
function tabs(){$("#solvedTab").classList.toggle("active",mode==="solved");$("#cutTab").classList.toggle("active",mode==="cut")}
function capacity(n){return 3*n*(n-1)/2} // internal edges in order-n triangular lattice
function chooseN(k){let n=2;while(capacity(n)<k&&n<10)n++;return n}
function V(r,c,n){let side=Math.min(165,650/n),h=side*Math.sqrt(3)/2;return[410+(c-r/2)*side,45+r*h]}
function pieces(n){let o=[];for(let r=0;r<n;r++)for(let c=0;c<=r;c++){o.push({v:[V(r,c,n),V(r+1,c,n),V(r+1,c+1,n)]});if(c<r)o.push({v:[V(r,c,n),V(r,c+1,n),V(r+1,c+1,n)]})}return o}
function key(a,b){let A=a.map(x=>x.toFixed(4)).join(","),B=b.map(x=>x.toFixed(4)).join(",");return A<B?A+"|"+B:B+"|"+A}
function shared(ps){let m=new Map();ps.forEach((p,pi)=>p.v.forEach((a,e)=>{let k=key(a,p.v[(e+1)%3]);if(!m.has(k))m.set(k,[]);m.get(k).push({pi,e})}));return[...m.values()].filter(x=>x.length===2)}
function cen(v){return[v.reduce((a,p)=>a+p[0],0)/3,v.reduce((a,p)=>a+p[1],0)/3]}
function label(v,e,text,n){let a=v[e],b=v[(e+1)%3],c=cen(v),mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy),nx=-dy/L,ny=dx/L;if((c[0]-mx)*nx+(c[1]-my)*ny<0){nx=-nx;ny=-ny}let off=Math.max(10,18-n),x=mx+nx*off,y=my+ny*off,ang=Math.atan2(dy,dx)*180/Math.PI;if(ang>90||ang<-90)ang+=180;let fs=Math.max(7,12-(n-4)*.8),max=n>6?15:24,t=text.length>max?text.slice(0,max-1)+"…":text;return`<text class="edgeText" style="font-size:${fs}px" x="${x}" y="${y}" transform="rotate(${ang} ${x} ${y})">${esc(t)}</text>`}
function data(){let G=good(),n=chooseN(G.length),ps=pieces(n),sh=shared(ps),labs=ps.map(()=>["","",""]);G.slice(0,sh.length).forEach((p,i)=>{let A=sh[i][0],B=sh[i][1];labs[A.pi][A.e]=p[0];labs[B.pi][B.e]=p[1]});return{G,n,ps,sh,labs}}
function solved(d){return d.ps.map((p,i)=>`<polygon class="piece" points="${p.v.map(x=>x.join(",")).join(" ")}"/>`+d.labs[i].map((t,e)=>t?label(p.v,e,t,d.n):"").join("")).join("")}
function order(n){let a=[...Array(n).keys()],x=seed*7919;for(let i=n-1;i;i--){x=(x*1664525+1013904223)>>>0;let j=x%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function tv(v,tx,ty,sc,rot){let c=cen(v),a=rot*Math.PI/180,co=Math.cos(a),si=Math.sin(a);return v.map(p=>{let x=(p[0]-c[0])*sc,y=(p[1]-c[1])*sc;return[tx+x*co-y*si,ty+x*si+y*co]})}
function cut(d){let N=d.ps.length,cols=N<=16?4:5,rows=Math.ceil(N/cols),cw=800/cols,ch=700/rows,base=Math.min(165,650/d.n),sc=Math.min(.72,(cw*.72)/base,(ch*.72)/(base*.866));return order(N).map((idx,pos)=>{let col=pos%cols,row=Math.floor(pos/cols),x=cw/2+col*cw+10,y=ch/2+row*ch+20,v=tv(d.ps[idx].v,x,y,sc,[0,120,240][(pos+seed)%3]);return`<polygon class="piece" points="${v.map(q=>q.join(",")).join(" ")}"/>`+d.labs[idx].map((t,e)=>t?label(v,e,t,Math.max(4,d.n-1)):"").join("")+`<text class="pieceNo" x="${x}" y="${y+base*sc*.27}">${idx+1}</text>`}).join("")}
function draw(){let d=data();S.innerHTML=mode==="solved"?solved(d):cut(d);$("#sizeLabel").textContent=`Size ${d.n} • ${d.ps.length} pieces`;$("#status").textContent=`${d.G.length} pairs entered • ${d.sh.length} matching edges available • ${d.ps.length} triangular pieces`+(d.sh.length>d.G.length?` • ${d.sh.length-d.G.length} internal edge(s) left blank`:"")}
renderRows();
</script></body></html>
